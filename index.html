<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción — FISC UTP</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Inscripción a curso</h1>
    <p>Facultad de Ingeniería de Sistemas Computacionales — UTP</p>
  </header>

  <form id="inscripcion" novalidate>

    <!-- NOMBRE COMPLETO -->
    <div class="campo">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" autocomplete="name"
             aria-describedby="nombre-error">
      <p id="nombre-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CÉDULA -->
    <div class="campo">
      <label for="cedula">Cédula</label>
      <input id="cedula" name="cedula" type="text" placeholder="8-123-4567"
             aria-describedby="cedula-error">
      <p id="cedula-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CORREO -->
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" autocomplete="email"
             aria-describedby="correo-error">
      <p id="correo-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CELULAR -->
    <div class="campo">
      <label for="celular">Celular</label>
      <input id="celular" name="celular" type="tel" placeholder="61234567"
             aria-describedby="celular-error">
      <p id="celular-error" class="error" aria-live="polite"></p>
    </div>

    <!-- FECHA DE NACIMIENTO -->
    <div class="campo">
      <label for="nacimiento">Fecha de nacimiento</label>
      <input id="nacimiento" name="nacimiento" type="date"
             aria-describedby="nacimiento-error">
      <p id="nacimiento-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CURSO -->
    <div class="campo">
      <label for="curso">Curso</label>
      <select id="curso" name="curso" aria-describedby="curso-error">
        <option value="">Selecciona un curso</option>
        <option>Programación Web</option>
        <option>Bases de Datos</option>
        <option>Redes</option>
        <option>Inteligencia Artificial</option>
        <option>Seguridad Informática</option>
      </select>
      <p id="curso-error" class="error" aria-live="polite"></p>
    </div>

    <!-- MODALIDAD (radio) -->
    <fieldset class="campo">
      <legend>Modalidad</legend>
      <label><input type="radio" name="modalidad" value="presencial"> Presencial</label>
      <label><input type="radio" name="modalidad" value="virtual"> Virtual</label>
      <p id="modalidad-error" class="error" aria-live="polite"></p>
    </fieldset>

    <!-- SEDE (oculta hasta que modalidad = presencial) -->
    <div class="campo" id="campo-sede" hidden>
      <label for="sede">Sede</label>
      <select id="sede" name="sede" aria-describedby="sede-error">
        <option value="">Selecciona una sede</option>
        <option>Ciudad de Panamá</option>
        <option>David</option>
        <option>Santiago</option>
      </select>
      <p id="sede-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CONTRASEÑA -->
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="new-password"
             aria-describedby="clave-error">
      <div class="fuerza" aria-hidden="true"><span id="barra-fuerza"></span></div>
      <p id="clave-error" class="error" aria-live="polite"></p>
    </div>

    <!-- CONFIRMAR CONTRASEÑA -->
    <div class="campo">
      <label for="clave2">Confirmar contraseña</label>
      <input id="clave2" name="clave2" type="password" autocomplete="new-password"
             aria-describedby="clave2-error">
      <p id="clave2-error" class="error" aria-live="polite"></p>
    </div>

    <!-- COMENTARIOS -->
    <div class="campo">
      <label for="comentarios">Comentarios (opcional)</label>
      <textarea id="comentarios" name="comentarios" rows="3" maxlength="200"
                aria-describedby="comentarios-error"></textarea>
      <p class="contador"><span id="contador-comentarios">0</span> / 200</p>
      <p id="comentarios-error" class="error" aria-live="polite"></p>
    </div>

    <!-- TÉRMINOS -->
    <div class="campo">
      <label class="check">
        <input id="terminos" name="terminos" type="checkbox"
               aria-describedby="terminos-error">
        Acepto los términos y condiciones
      </label>
      <p id="terminos-error" class="error" aria-live="polite"></p>
    </div>

    <button type="submit">Inscribirme</button>
  </form>

  <section id="confirmacion" aria-live="polite"></section>

  <script src="apps.js" defer></script>
</body>
</html>
